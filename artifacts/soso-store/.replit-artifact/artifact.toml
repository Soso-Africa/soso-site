kind = "web"
previewPath = "/"
title = "SOSO Africa Store"
description = "A production-oriented, conversion-first bespoke menswear storefront for SOSO Africa. It offers responsive shopping, product sizing guidance, availability-first checkout states, structured SEO foundations, and a clean JusticeSure headless commerce boundary."
version = "1.0.0"
id = "artifacts/soso-store"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24036

[services.development]
run = "pnpm --filter @workspace/soso-store run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/soso-store", "run", "build" ]
serve = "static"
publicDir = "artifacts/soso-store/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24036"
BASE_PATH = "/"
