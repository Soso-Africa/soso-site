openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Public SOSO storefront services
  - name: staff
    description: Authenticated staff operations
  - name: storage
    description: Staff image uploads and public object serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /payment/catalog:
    get:
      operationId: getCommerceCatalog
      tags: [storefront]
      summary: Get the published JusticeSure catalogue
      responses:
        "200":
          description: Customer-safe JusticeSure catalogue projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommerceCatalog"
  /payment/locations:
    get:
      operationId: getCommerceLocations
      tags: [storefront]
      summary: Get published JusticeSure pickup locations
      responses:
        "200":
          description: Customer-safe JusticeSure locations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommerceLocations"
  /payment/initiate:
    post:
      operationId: initiateCommerceCheckout
      tags: [storefront]
      summary: Create or safely resume a hosted JusticeSure payment session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceCheckoutInput"
      responses:
        "200":
          description: Hosted payment session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercePaymentSession"
        "400":
          description: Invalid checkout details
        "403":
          description: Checkout attempt belongs to another browser session
        "409":
          description: Idempotency key conflicts with different checkout details
        "503":
          description: Payment is not available or cannot be confirmed
  /payment/status/{attemptId}:
    get:
      operationId: getCommercePaymentStatus
      tags: [storefront]
      summary: Read JusticeSure-verified status for a browser-owned checkout attempt
      parameters:
        - in: path
          name: attemptId
          required: true
          schema: { type: string, minLength: 36, maxLength: 36 }
      responses:
        "200":
          description: Verified Commerce order status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercePaymentStatus"
        "202":
          description: Commerce order is still being created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommercePaymentStatus"
        "404":
          description: Checkout attempt is unknown or not owned by this browser
        "503":
          description: Authoritative payment status cannot be checked
  /payment/webhook:
    post:
      operationId: receiveCommerceWebhook
      tags: [storefront]
      summary: Receive a signed JusticeSure Commerce webhook
      parameters:
        - in: header
          name: X-JusticeSure-Timestamp
          required: true
          schema: { type: string, minLength: 1, maxLength: 32 }
        - in: header
          name: X-JusticeSure-Event-Id
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: header
          name: X-JusticeSure-Event
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: header
          name: X-JusticeSure-Signature
          required: true
          schema: { type: string, minLength: 71, maxLength: 71 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommerceWebhookInput"
      responses:
        "200":
          description: Webhook received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommerceWebhookReceipt"
        "401":
          description: Invalid signature or event envelope
        "503":
          description: Processing did not complete; JusticeSure should retry
  /analytics/events:
    post:
      operationId: recordAnalyticsEvent
      tags: [storefront]
      summary: Record a consent-aware storefront event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acknowledgement"
  /consent:
    post:
      operationId: recordConsent
      tags: [storefront]
      summary: Save a visitor consent decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "201":
          description: Consent saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [storefront]
      summary: Send a pre-purchase question to the atelier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
  /privacy-requests:
    post:
      operationId: createPrivacyRequest
      tags: [storefront]
      summary: Submit a privacy access or deletion request
      description: Accepts a request without disclosing whether the supplied contact details match any customer record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyRequestInput"
      responses:
        "202":
          description: Request accepted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyRequestAcknowledgement"
        "400":
          description: Invalid privacy request
        "429":
          description: Too many requests from this source
  /journal:
    get:
      operationId: listJournalPosts
      tags: [storefront]
      summary: List published Journal articles
      responses:
        "200":
          description: Published articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalPostSummary"
  /journal/{slug}:
    get:
      operationId: getJournalPost
      tags: [storefront]
      summary: Get a published Journal article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalPost"
        "404":
          description: Article not found
  /faq:
    get:
      operationId: listFaqItems
      tags: [storefront]
      summary: List frequently asked questions
      responses:
        "200":
          description: FAQ items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FaqItem"
  /staff/faq-history:
    get:
      operationId: listStaffFaqHistory
      tags: [staff]
      summary: List immutable FAQ audit records with cursor pagination
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: FAQ audit records, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaqHistoryPage"
        "400":
          description: Invalid pagination query
        "403":
          description: Owner, administrator, or editor access required
        "404":
          description: FAQ item and history not found
  /policies:
    get:
      operationId: listPolicies
      tags: [storefront]
      summary: List currently effective published policy summaries
      responses:
        "200":
          description: Effective published policy summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PolicySummary"
  /policies/{slug}:
    get:
      operationId: getPolicy
      tags: [storefront]
      summary: Get a currently effective published policy
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 160 }
      responses:
        "200":
          description: Effective published policy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyDocument"
        "400": { description: "Invalid policy slug" }
        "404": { description: "No effective policy is published" }
        "500": { description: "Published policy content is invalid" }
  /redirects:
    get:
      operationId: getRedirect
      tags: [storefront]
      summary: Resolve a configured internal URL redirect
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
            maxLength: 512
      responses:
        "200":
          description: Matching redirect, or an explicit no-match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedirectLookup"
  /content/platform:
    get:
      operationId: getPlatformContent
      tags: [storefront]
      summary: Get the published platform content document
      responses:
        "200":
          description: Published platform content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedPlatformContent"
        "404": { description: "Platform content is not published" }
  /content/site:
    get:
      operationId: getSiteContent
      tags: [storefront]
      summary: Get the compatibility site projection from published platform content
      responses:
        "200":
          description: Published site globals
          content:
            application/json:
              schema:
                type: object
                required: [content]
                properties:
                  content: { type: object, additionalProperties: true }
  /staff/me:
    get:
      operationId: getStaffProfile
      tags: [staff]
      summary: Get the authenticated staff member's role
      responses:
        "200":
          description: Current staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "401":
          description: Authentication required
        "403":
          description: Staff access required
  /staff/access:
    get:
      operationId: listStaffAccess
      tags: [staff]
      summary: List active and inactive staff access mappings
      responses:
        "200":
          description: Staff access mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAccessMapping"
        "403":
          description: Owner access required
    post:
      operationId: createStaffAccess
      tags: [staff]
      summary: Assign an SOSO role to an existing Clerk user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccessInput"
      responses:
        "201":
          description: Staff access mapping created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccessMapping"
        "400":
          description: Invalid or duplicate mapping
        "403":
          description: Owner access required
  /staff/access/{id}:
    patch:
      operationId: updateStaffAccess
      tags: [staff]
      summary: Change a staff role or deactivate staff access
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffAccessUpdate"
      responses:
        "200":
          description: Staff access mapping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAccessMapping"
        "400":
          description: Invalid update or final owner protection
        "403":
          description: Owner access required
        "404":
          description: Mapping not found
  /staff/overview:
    get:
      operationId: getStaffOverview
      tags: [staff]
      summary: Get operational and funnel overview
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Current overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOverview"
        "401":
          description: Authentication required
        "403":
          description: Staff access required
  /staff/orders:
    get:
      operationId: listStaffOrders
      tags: [staff]
      summary: List the current active operations queue, or a date-bounded status history when status is supplied
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
        - name: status
          in: query
          schema:
            type: string
            enum: [payment_pending, paid, atelier_confirmation, in_production, ready, fulfilled, cancelled, refunded]
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOrder"
  /staff/funnel:
    get:
      operationId: getStaffFunnel
      tags: [staff]
      summary: Get consented first-party storefront event counts
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Last seven days of raw consented event counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffFunnel"
        "401":
          description: Authentication required
        "403":
          description: Owner or analyst access required
  /staff/analytics/quality:
    get:
      operationId: getStaffAnalyticsQuality
      tags: [staff]
      summary: Get aggregate data-quality signals for consented storefront analytics
      responses:
        "200":
          description: Privacy-safe analytics data-quality report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsQualityReport"
        "401":
          description: Authentication required
        "403":
          description: Owner or analyst access required
  /staff/enquiries:
    get:
      operationId: listStaffEnquiries
      tags: [staff]
      summary: List customer enquiries
      responses:
        "200":
          description: Recent enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
  /staff/orders/{id}:
    patch:
      operationId: updateStaffOrder
      tags: [staff]
      summary: Advance a verified order, record atelier work or delivery information, and request an internal refund review
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffOrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrder"
        "400": { description: "Invalid workflow update" }
        "403": { description: "Owner or operations access required" }
        "404": { description: "Order not found" }
        "409": { description: "Order changed while being updated" }
  /staff/enquiries/{id}:
    patch:
      operationId: updateStaffEnquiry
      tags: [staff]
      summary: Update a customer enquiry queue status and internal handling note
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffEnquiryUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400": { description: "Invalid enquiry update" }
        "403": { description: "Owner, operations, or stylist access required" }
        "404": { description: "Enquiry not found" }
  /staff/privacy-requests:
    get:
      operationId: listStaffPrivacyRequests
      tags: [staff]
      summary: List privacy request queue items
      responses:
        "200":
          description: Privacy requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffPrivacyRequest"
        "403": { description: "Owner or operations access required" }
    post:
      operationId: createStaffPrivacyRequest
      tags: [staff]
      summary: Log a privacy access or deletion request received by the support team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPrivacyRequestInput"
      responses:
        "201":
          description: Privacy request logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPrivacyRequest"
        "400": { description: "Invalid privacy request" }
        "403": { description: "Owner or operations access required" }
  /staff/privacy-requests/{id}:
    patch:
      operationId: updateStaffPrivacyRequest
      tags: [staff]
      summary: Verify, progress, complete, or reject a privacy request following the approved procedure
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPrivacyRequestUpdate"
      responses:
        "200":
          description: Updated privacy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPrivacyRequest"
        "400": { description: "Invalid privacy workflow update" }
        "403": { description: "Required staff permission is missing" }
        "404": { description: "Privacy request not found" }
        "409": { description: "Privacy request changed while being updated" }
  /staff/notifications:
    get:
      operationId: listStaffNotifications
      tags: [staff]
      summary: List operational notifications available to the active staff role
      responses:
        "200":
          description: Operational notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffNotification"
  /staff/notifications/{id}:
    patch:
      operationId: acknowledgeStaffNotification
      tags: [staff]
      summary: Acknowledge an operational notification
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffNotificationAcknowledgement"
      responses:
        "200":
          description: Acknowledged notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffNotification"
        "404": { description: "Notification not found" }
  /staff/audit:
    get:
      operationId: listStaffAuditEvents
      tags: [staff]
      summary: List operational audit events without customer personal data
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAuditEvent"
        "403": { description: "Owner or analyst access required" }
  /staff/exports:
    get:
      operationId: getStaffExport
      tags: [staff]
      summary: Generate a controlled, privacy-safe operations or analytics export
      parameters:
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [operations_summary, analytics_summary, campaign_aggregate, content_seo_aggregate]
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Controlled export data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffExport"
        "403": { description: "Owner or analyst access required" }
  /staff/journal:
    get:
      operationId: listStaffJournalPosts
      tags: [staff]
      summary: List all Journal articles for staff management
      responses:
        "200":
          description: Journal articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffJournalPost"
    post:
      operationId: createStaffJournalPost
      tags: [staff]
      summary: Create a Journal article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffJournalPostInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffJournalPost"
        "400":
          description: Invalid article
        "403":
          description: Editor or owner access required
  /staff/journal/{id}:
    patch:
      operationId: updateStaffJournalPost
      tags: [staff]
      summary: Update, publish, draft, or archive a Journal article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F-]{36}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffJournalPostUpdate"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffJournalPost"
        "400":
          description: Invalid update
        "403":
          description: Editor or owner access required
        "404":
          description: Article not found
  /staff/journal/{id}/revisions:
    get:
      operationId: listStaffJournalPostRevisions
      tags: [staff]
      summary: List immutable revision snapshots for a Journal article
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      responses:
        "200":
          description: Journal revision history, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffJournalPostRevision"
        "403":
          description: Editor or owner access required
        "404":
          description: Article not found
  /staff/content/platform:
    get:
      operationId: getStaffPlatformContent
      tags: [staff]
      summary: Get draft and published platform content
      responses:
        "200":
          description: Platform content state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPlatformContent" }
        "403": { description: "Owner, administrator, or editor access required" }
    put:
      operationId: updateStaffPlatformContent
      tags: [staff]
      summary: Save a validated platform draft with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformContentUpdate" }
      responses:
        "200":
          description: Updated platform content state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPlatformContent" }
        "400": { description: "Invalid complete platform document" }
        "409": { description: "Draft was changed by another editor" }
  /staff/content/platform/publish:
    post:
      operationId: publishStaffPlatformContent
      tags: [staff]
      summary: Publish the current validated platform draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformContentPublication" }
      responses:
        "200":
          description: Published platform content state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPlatformContent" }
        "409": { description: "Draft was changed by another editor" }
  /staff/content/platform/unpublish:
    post:
      operationId: unpublishStaffPlatformContent
      tags: [staff]
      summary: Remove the public platform document without deleting its draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlatformContentPublication" }
      responses:
        "200":
          description: Unpublished platform content state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffPlatformContent" }
        "409": { description: "Draft was changed by another editor" }
  /staff/content/platform/revisions:
    get:
      operationId: listStaffPlatformContentRevisions
      tags: [staff]
      summary: List immutable platform content revisions
      responses:
        "200":
          description: Revisions newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformContentRevision" }
  /marketing-pixels:
    get:
      operationId: getPublicMarketingPixels
      tags: [content]
      summary: Get valid enabled public marketing pixel identifiers
      responses:
        "200":
          description: Fail-closed public marketing pixel configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicMarketingPixelSettings" }
  /staff/marketing-pixels:
    get:
      operationId: getStaffMarketingPixels
      tags: [staff]
      summary: Get governed marketing pixel settings
      responses:
        "200":
          description: Current marketing pixel settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMarketingPixelSettings" }
        "403": { description: "Owner or administrator access required" }
    put:
      operationId: updateStaffMarketingPixels
      tags: [staff]
      summary: Replace governed marketing pixel settings with optimistic concurrency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarketingPixelSettingsUpdate" }
      responses:
        "200":
          description: Updated marketing pixel settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffMarketingPixelSettings" }
        "400": { description: "Missing, malformed, or unsupported provider identifier" }
        "403": { description: "Owner or administrator access required" }
        "409": { description: "Settings changed while they were being edited" }
  /staff/marketing-pixels/history:
    get:
      operationId: listStaffMarketingPixelRevisions
      tags: [staff]
      summary: List immutable marketing pixel setting revisions
      responses:
        "200":
          description: Marketing pixel revision history, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MarketingPixelSettingsRevision" }
        "403": { description: "Owner or administrator access required" }
  /staff/policies:
    get:
      operationId: listStaffPolicies
      tags: [staff]
      summary: List policy versions
      responses:
        "200":
          description: Policy versions
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StaffPolicy" } } } }
    post:
      operationId: createStaffPolicy
      tags: [staff]
      summary: Create the next draft version of a policy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffPolicyInput" } } }
      responses:
        "201":
          description: Created policy draft
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffPolicy" } } }
  /staff/policies/{id}:
    put:
      operationId: updateStaffPolicy
      tags: [staff]
      summary: Update a draft policy version
      parameters: [{ $ref: "#/components/parameters/StaffEntityId" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffPolicyInput" } } }
      responses:
        "200":
          description: Updated policy draft
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffPolicy" } } }
        "409": { description: "Published policy versions are immutable" }
    delete:
      operationId: deleteStaffPolicy
      tags: [staff]
      summary: Archive a draft policy version
      parameters: [{ $ref: "#/components/parameters/StaffEntityId" }]
      responses:
        "204": { description: "Policy draft archived" }
        "409": { description: "Published policy versions cannot be archived" }
  /staff/policies/{id}/publish:
    post:
      operationId: publishStaffPolicy
      tags: [staff]
      summary: Publish a policy with an effective date
      parameters: [{ $ref: "#/components/parameters/StaffEntityId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffPolicyPublicationInput" }
      responses:
        "200":
          description: Published policy
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffPolicy" } } }
  /staff/policies/{id}/history:
    get:
      operationId: listStaffPolicyHistory
      tags: [staff]
      summary: List immutable policy revisions
      parameters: [{ $ref: "#/components/parameters/StaffEntityId" }]
      responses:
        "200":
          description: Policy revisions
          content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } }
  /staff/redirects:
    get:
      operationId: listStaffRedirects
      tags: [staff]
      summary: List redirect drafts and publication state
      responses:
        "200":
          description: Redirects
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/StaffRedirect" } } } }
    post:
      operationId: createStaffRedirect
      tags: [staff]
      summary: Create an unpublished internal redirect
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffRedirectInput" } } }
      responses:
        "201":
          description: Redirect created
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffRedirect" } } }
  /staff/redirects/{id}:
    put:
      operationId: updateStaffRedirect
      tags: [staff]
      summary: Update an internal redirect
      parameters:
        - { $ref: "#/components/parameters/StaffEntityId" }
        - { $ref: "#/components/parameters/RedirectExpectedRevision" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StaffRedirectInput" } } }
      responses:
        "200":
          description: Redirect updated
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffRedirect" } } }
    delete:
      operationId: deleteStaffRedirect
      tags: [staff]
      summary: Delete a redirect
      parameters:
        - { $ref: "#/components/parameters/StaffEntityId" }
        - { $ref: "#/components/parameters/RedirectExpectedRevision" }
      responses:
        "204": { description: "Redirect deleted" }
  /staff/redirects/{id}/publish:
    post:
      operationId: publishStaffRedirect
      tags: [staff]
      summary: Publish or unpublish a redirect
      parameters:
        - { $ref: "#/components/parameters/StaffEntityId" }
        - { $ref: "#/components/parameters/RedirectExpectedRevision" }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StaffRedirectPublicationInput" }
      responses:
        "200":
          description: Redirect publication state updated
          content: { application/json: { schema: { $ref: "#/components/schemas/StaffRedirect" } } }
  /staff/redirects/{id}/history:
    get:
      operationId: listStaffRedirectHistory
      tags: [staff]
      summary: List immutable redirect revisions
      parameters: [{ $ref: "#/components/parameters/StaffEntityId" }]
      responses:
        "200":
          description: Redirect revisions
          content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a signed direct-upload URL for staff-managed storefront media
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadUrlRequest" }
      responses:
        "200":
          description: Signed upload URL and durable browser path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadUrlResponse" }
        "400": { description: "Invalid image or video metadata" }
        "401": { description: "Staff authentication required" }
        "403": { description: "Editorial staff role required" }
        "500": { description: "Upload URL could not be created" }
  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Publicly serve uploaded storefront media
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Immutable uploaded media
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: "Object not found" }
        "500": { description: "Object could not be served" }
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicStorageObject
      tags: [storage]
      summary: Publicly serve an object from configured public search paths
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Immutable public media
          content:
            "*/*":
              schema: { type: string, format: binary }
        "404": { description: "Object not found" }
        "500": { description: "Object could not be served" }
components:
  parameters:
    RedirectExpectedRevision:
      name: X-SOSO-Expected-Revision
      in: header
      required: false
      description: Last observed redirect updatedAt value used to reject stale mutations.
      schema:
        type: string
        format: date-time
    StaffEntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    StaffDateFrom:
      name: from
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    StaffDateTo:
      name: to
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  schemas:
    UploadUrlRequest:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[A-Za-z0-9][A-Za-z0-9._ -]{0,159}$"
        size:
          type: number
          minimum: 1
          maximum: 12582912
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/gif, video/mp4, video/webm]
    UploadUrlResponse:
      type: object
      additionalProperties: false
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, minLength: 1 }
        objectPath:
          type: string
          pattern: "^/api/storage/objects/uploads/"
    PlatformContent:
      type: object
      description: Complete validated platform document containing site globals, homepage and page copy, products, collections, size guide, product copy, and support copy.
      additionalProperties: false
      required: [site, homepage, pages, products, collections, sizeGuide, productCopy, supportCopy]
      properties:
        site: { type: object, additionalProperties: true }
        homepage: { type: object, additionalProperties: true }
        pages: { type: object, additionalProperties: true }
        products: { type: array, items: { type: object, additionalProperties: true } }
        collections: { type: array, items: { type: object, additionalProperties: true } }
        sizeGuide: { type: object, additionalProperties: true }
        productCopy: { type: object, additionalProperties: true }
        supportCopy: { type: object, additionalProperties: true }
    PublishedPlatformContent:
      type: object
      required: [content, publishedAt]
      properties:
        content: { $ref: "#/components/schemas/PlatformContent" }
        publishedAt: { type: string, format: date-time }
    StaffPlatformContent:
      type: object
      required: [key, draft, published, draftUpdatedAt]
      properties:
        key: { type: string, enum: [platform] }
        draft: { $ref: "#/components/schemas/PlatformContent" }
        published: { type: object, additionalProperties: true }
        draftUpdatedAt: { type: string, format: date-time }
        publishedAt: { type: ["string", "null"], format: date-time }
        updatedByClerkUserId: { type: ["string", "null"] }
        publishedByClerkUserId: { type: ["string", "null"] }
    PlatformContentUpdate:
      type: object
      additionalProperties: false
      required: [content, expectedDraftUpdatedAt]
      properties:
        content: { $ref: "#/components/schemas/PlatformContent" }
        expectedDraftUpdatedAt: { type: string, format: date-time }
    PlatformContentPublication:
      type: object
      additionalProperties: false
      required: [expectedDraftUpdatedAt]
      properties:
        expectedDraftUpdatedAt: { type: string, format: date-time }
    PlatformContentRevision:
      type: object
      required: [id, contentKey, event, contentHash, createdByClerkUserId, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        contentKey: { type: string, enum: [platform] }
        event: { type: string, enum: [draft_saved, published, unpublished] }
        snapshot: { type: ["object", "null"], additionalProperties: true }
        contentHash: { type: string }
        createdByClerkUserId: { type: string }
        createdAt: { type: string, format: date-time }
    StaffPolicyInput:
      type: object
      additionalProperties: false
      required: [slug, title, summary, sections]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 160 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        sections:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PolicySection" }
    PolicySection:
      type: object
      additionalProperties: false
      required: [id, heading]
      properties:
        id: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 160 }
        heading: { type: string, minLength: 1, maxLength: 240 }
        paragraphs:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 10000 }
        bullets:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1000 }
      anyOf:
        - required: [paragraphs]
        - required: [bullets]
    PolicySummary:
      type: object
      additionalProperties: false
      required: [slug, title, summary, version, effectiveAt]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 160 }
        title: { type: string, minLength: 1, maxLength: 160 }
        summary: { type: string, minLength: 1, maxLength: 1000 }
        version: { type: number, minimum: 1 }
        effectiveAt: { type: string, format: date-time }
    PolicyDocument:
      allOf:
        - $ref: "#/components/schemas/PolicySummary"
        - type: object
          additionalProperties: false
          required: [sections]
          properties:
            sections:
              type: array
              minItems: 1
              items: { $ref: "#/components/schemas/PolicySection" }
    StaffPolicy:
      type: object
      additionalProperties: true
      required: [id, slug, title, summary, sections, version, status]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        slug: { type: string }
        title: { type: string }
        summary: { type: string }
        sections:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PolicySection" }
        version: { type: number, minimum: 1 }
        status: { type: string, enum: [draft, published, archived] }
    StaffPolicyPublicationInput:
      type: object
      properties:
        effectiveAt: { type: string, format: date-time }
    StaffRedirectInput:
      type: object
      additionalProperties: false
      required: [fromPath, toPath, statusCode]
      properties:
        fromPath: { type: string, pattern: "^/(?!/)", maxLength: 512 }
        toPath: { type: string, pattern: "^/(?!/)", maxLength: 512 }
        statusCode: { type: integer, enum: [301, 302, 307, 308] }
    StaffRedirect:
      allOf:
        - $ref: "#/components/schemas/StaffRedirectInput"
        - type: object
          required: [id, isPublished, createdAt, updatedAt]
          properties:
            id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
            isPublished: { type: boolean }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    StaffRedirectPublicationInput:
      type: object
      properties:
        published: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Acknowledgement:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    AnalyticsEventInput:
      type: object
      required: [eventId, eventVersion, anonymousId, sessionId, eventName, path, consent, occurredAt]
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 128
        eventVersion:
          type: number
          minimum: 1
        anonymousId:
          type: string
          minLength: 8
          maxLength: 128
        sessionId:
          type: string
          minLength: 8
          maxLength: 128
        eventName:
          type: string
          enum: [page_view, session_started, active_time_heartbeat, product_view, product_image_viewed, size_guide_opened, size_selected, stylist_inquiry_started, stylist_inquiry_completed, add_to_bag, cart_opened, checkout_started, checkout_field_error, checkout_form_completed, payment_clicked, checkout_payment_unavailable, consent_banner_viewed, consent_updated, marketing_opt_out, blog_article_viewed, faq_expanded, scroll_depth_reached, cta_clicked]
        path:
          type: string
          maxLength: 512
        referrer:
          type: string
          maxLength: 1024
        source:
          type: string
          maxLength: 128
        utmMedium:
          type: string
          maxLength: 128
        utmCampaign:
          type: string
          maxLength: 256
        deviceType:
          type: string
          enum: [mobile, tablet, desktop, unknown]
        consent:
          type: string
          enum: [essential_only, analytics, marketing]
        properties:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    ConsentInput:
      type: object
      required: [anonymousId, state, policyVersion]
      properties:
        anonymousId:
          type: string
          minLength: 8
          maxLength: 128
        state:
          type: string
          enum: [essential_only, analytics, marketing]
        policyVersion:
          type: string
          maxLength: 64
        region:
          type: string
          maxLength: 32
    ConsentRecord:
      type: object
      required: [id, anonymousId, state, policyVersion, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        anonymousId: { type: string }
        state: { type: string }
        policyVersion: { type: string }
        createdAt: { type: string, format: date-time }
    EnquiryInput:
      type: object
      required: [message]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, maxLength: 320 }
        phone: { type: string, maxLength: 40 }
        productSlug: { type: string, maxLength: 160 }
        message: { type: string, minLength: 8, maxLength: 2000 }
    Enquiry:
      type: object
      required: [id, message, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        productSlug: { type: ["string", "null"] }
        message: { type: string }
        status: { type: string }
        handlingNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PrivacyRequestInput:
      type: object
      required: [requestType, requesterEmail]
      properties:
        requestType: { type: string, enum: [access, deletion] }
        requesterName: { type: ["string", "null"], minLength: 1, maxLength: 120 }
        requesterEmail: { type: string, minLength: 3, maxLength: 320, pattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$' }
    PrivacyRequestAcknowledgement:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    FaqItem:
      type: object
      required: [id, question, answer, category]
      properties:
        id: { type: string }
        question: { type: string }
        answer: { type: string }
        category: { type: string }
    FaqHistorySnapshot:
      type: object
      required: [question, answer, category, sortOrder, isPublished]
      properties:
        question: { type: string }
        answer: { type: string }
        category: { type: ["string", "null"] }
        sortOrder: { type: number }
        isPublished: { type: boolean }
    FaqHistoryTransition:
      type: object
      required: [from, to]
      properties:
        from: { type: ["string", "null"] }
        to: { type: string }
    FaqHistoryMetadata:
      type: object
      properties:
        snapshot: { $ref: "#/components/schemas/FaqHistorySnapshot" }
        previousSnapshot: { $ref: "#/components/schemas/FaqHistorySnapshot" }
        transition: { $ref: "#/components/schemas/FaqHistoryTransition" }
    FaqHistoryEvent:
      type: object
      required: [id, actorClerkUserId, action, metadata, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        actorClerkUserId: { type: string }
        action: { type: string }
        metadata: { $ref: "#/components/schemas/FaqHistoryMetadata" }
        createdAt: { type: string, format: date-time }
    FaqHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FaqHistoryEvent" }
        nextCursor: { type: ["string", "null"] }
    JournalPostSummary:
      type: object
      required: [slug, title, excerpt, authorName, publishedAt]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImageUrl: { type: ["string", "null"] }
        coverImageAlt: { type: ["string", "null"] }
        authorName: { type: string }
        category: { type: ["string", "null"] }
        tags: { type: ["array", "null"], items: { type: string } }
        readTimeMinutes: { type: ["number", "null"] }
        publishedAt: { type: string, format: date-time }
    JournalPost:
      allOf:
        - $ref: "#/components/schemas/JournalPostSummary"
        - type: object
          required: [body, updatedAt]
          properties:
            body: { type: string }
            seoTitle: { type: ["string", "null"] }
            seoDescription: { type: ["string", "null"] }
            relatedProductSlugs: { type: ["array", "null"], items: { type: string } }
            relatedArticleSlugs: { type: ["array", "null"], items: { type: string } }
            updatedAt: { type: string, format: date-time }
    StaffJournalPostInput:
      type: object
      required: [slug, title, excerpt, body, authorName, status]
      properties:
        slug: { type: string, minLength: 3, maxLength: 140, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 4, maxLength: 180 }
        excerpt: { type: string, minLength: 20, maxLength: 360 }
        body: { type: string, minLength: 100, maxLength: 50000 }
        coverImageUrl: { type: ["string", "null"], maxLength: 2048 }
        coverImageAlt: { type: ["string", "null"], maxLength: 300 }
        authorName: { type: string, minLength: 2, maxLength: 120 }
        category: { type: ["string", "null"], maxLength: 80 }
        tags: { type: ["array", "null"], items: { type: string, maxLength: 60 }, maxItems: 10 }
        seoTitle: { type: ["string", "null"], maxLength: 120 }
        seoDescription: { type: ["string", "null"], maxLength: 320 }
        readTimeMinutes: { type: ["number", "null"], minimum: 1, maximum: 120 }
        relatedProductSlugs: { type: ["array", "null"], items: { type: string, maxLength: 160 }, maxItems: 6 }
        relatedArticleSlugs: { type: ["array", "null"], items: { type: string, maxLength: 160 }, maxItems: 6 }
        status: { type: string, enum: [draft, published, archived] }
    StaffJournalPostUpdate:
      type: object
      minProperties: 1
      properties:
        slug: { type: string, minLength: 3, maxLength: 140, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 4, maxLength: 180 }
        excerpt: { type: string, minLength: 20, maxLength: 360 }
        body: { type: string, minLength: 100, maxLength: 50000 }
        coverImageUrl: { type: ["string", "null"], maxLength: 2048 }
        coverImageAlt: { type: ["string", "null"], maxLength: 300 }
        authorName: { type: string, minLength: 2, maxLength: 120 }
        category: { type: ["string", "null"], maxLength: 80 }
        tags: { type: ["array", "null"], items: { type: string, maxLength: 60 }, maxItems: 10 }
        seoTitle: { type: ["string", "null"], maxLength: 120 }
        seoDescription: { type: ["string", "null"], maxLength: 320 }
        readTimeMinutes: { type: ["number", "null"], minimum: 1, maximum: 120 }
        relatedProductSlugs: { type: ["array", "null"], items: { type: string, maxLength: 160 }, maxItems: 6 }
        relatedArticleSlugs: { type: ["array", "null"], items: { type: string, maxLength: 160 }, maxItems: 6 }
        status: { type: string, enum: [draft, published, archived] }
    StaffJournalPostSnapshot:
      type: object
      required: [slug, title, excerpt, body, authorName, status]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        body: { type: string }
        coverImageUrl: { type: ["string", "null"] }
        coverImageAlt: { type: ["string", "null"] }
        authorName: { type: string }
        category: { type: ["string", "null"] }
        tags: { type: ["array", "null"], items: { type: string } }
        seoTitle: { type: ["string", "null"] }
        seoDescription: { type: ["string", "null"] }
        readTimeMinutes: { type: ["number", "null"] }
        relatedProductSlugs: { type: ["array", "null"], items: { type: string } }
        relatedArticleSlugs: { type: ["array", "null"], items: { type: string } }
        status: { type: string, enum: [draft, published, archived] }
        publishedAt: { type: ["string", "null"], format: date-time }
    StaffJournalPostRevision:
      type: object
      required: [id, journalPostId, snapshot, contentHash, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        journalPostId: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        snapshot:
          $ref: "#/components/schemas/StaffJournalPostSnapshot"
        contentHash: { type: string }
        createdAt: { type: string, format: date-time }
    StaffJournalPost:
      type: object
      required: [id, slug, title, excerpt, body, authorName, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        body: { type: string }
