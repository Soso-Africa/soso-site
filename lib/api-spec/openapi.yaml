openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storefront
    description: Public SOSO storefront services
  - name: staff
    description: Authenticated staff operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /analytics/events:
    post:
      operationId: recordAnalyticsEvent
      tags: [storefront]
      summary: Record a consent-aware storefront event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsEventInput"
      responses:
        "202":
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Acknowledgement"
  /consent:
    post:
      operationId: recordConsent
      tags: [storefront]
      summary: Save a visitor consent decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentInput"
      responses:
        "201":
          description: Consent saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"
  /enquiries:
    post:
      operationId: createEnquiry
      tags: [storefront]
      summary: Send a pre-purchase question to the atelier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnquiryInput"
      responses:
        "201":
          description: Enquiry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
  /journal:
    get:
      operationId: listJournalPosts
      tags: [storefront]
      summary: List published Journal articles
      responses:
        "200":
          description: Published articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalPostSummary"
  /journal/{slug}:
    get:
      operationId: getJournalPost
      tags: [storefront]
      summary: Get a published Journal article
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Published article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalPost"
        "404":
          description: Article not found
  /staff/me:
    get:
      operationId: getStaffProfile
      tags: [staff]
      summary: Get the authenticated staff member's role
      responses:
        "200":
          description: Current staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "401":
          description: Authentication required
        "403":
          description: Staff access required
  /staff/overview:
    get:
      operationId: getStaffOverview
      tags: [staff]
      summary: Get operational and funnel overview
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Current overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOverview"
        "401":
          description: Authentication required
        "403":
          description: Staff access required
  /staff/orders:
    get:
      operationId: listStaffOrders
      tags: [staff]
      summary: List the current active operations queue, or a date-bounded status history when status is supplied
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
        - name: status
          in: query
          schema:
            type: string
            enum: [payment_pending, paid, atelier_confirmation, in_production, ready, fulfilled, cancelled, refunded]
      responses:
        "200":
          description: Recent orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffOrder"
  /staff/funnel:
    get:
      operationId: getStaffFunnel
      tags: [staff]
      summary: Get consented first-party storefront event counts
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Last seven days of raw consented event counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffFunnel"
        "401":
          description: Authentication required
        "403":
          description: Owner or analyst access required
  /staff/enquiries:
    get:
      operationId: listStaffEnquiries
      tags: [staff]
      summary: List customer enquiries
      responses:
        "200":
          description: Recent enquiries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Enquiry"
  /staff/orders/{id}:
    patch:
      operationId: updateStaffOrder
      tags: [staff]
      summary: Advance a verified order, record atelier work or delivery information, and request an internal refund review
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffOrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffOrder"
        "400": { description: "Invalid workflow update" }
        "403": { description: "Owner or operations access required" }
        "404": { description: "Order not found" }
        "409": { description: "Order changed while being updated" }
  /staff/enquiries/{id}:
    patch:
      operationId: updateStaffEnquiry
      tags: [staff]
      summary: Update a customer enquiry queue status and internal handling note
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffEnquiryUpdate"
      responses:
        "200":
          description: Updated enquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Enquiry"
        "400": { description: "Invalid enquiry update" }
        "403": { description: "Owner, operations, or stylist access required" }
        "404": { description: "Enquiry not found" }
  /staff/privacy-requests:
    get:
      operationId: listStaffPrivacyRequests
      tags: [staff]
      summary: List privacy request queue items
      responses:
        "200":
          description: Privacy requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffPrivacyRequest"
        "403": { description: "Owner or operations access required" }
    post:
      operationId: createStaffPrivacyRequest
      tags: [staff]
      summary: Log a privacy access or deletion request received by the support team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPrivacyRequestInput"
      responses:
        "201":
          description: Privacy request logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPrivacyRequest"
        "400": { description: "Invalid privacy request" }
        "403": { description: "Owner or operations access required" }
  /staff/privacy-requests/{id}:
    patch:
      operationId: updateStaffPrivacyRequest
      tags: [staff]
      summary: Verify, progress, complete, or reject a privacy request following the approved procedure
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffPrivacyRequestUpdate"
      responses:
        "200":
          description: Updated privacy request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffPrivacyRequest"
        "400": { description: "Invalid privacy workflow update" }
        "403": { description: "Required staff permission is missing" }
        "404": { description: "Privacy request not found" }
        "409": { description: "Privacy request changed while being updated" }
  /staff/notifications:
    get:
      operationId: listStaffNotifications
      tags: [staff]
      summary: List operational notifications available to the active staff role
      responses:
        "200":
          description: Operational notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffNotification"
  /staff/notifications/{id}:
    patch:
      operationId: acknowledgeStaffNotification
      tags: [staff]
      summary: Acknowledge an operational notification
      parameters:
        - $ref: "#/components/parameters/StaffEntityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffNotificationAcknowledgement"
      responses:
        "200":
          description: Acknowledged notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffNotification"
        "404": { description: "Notification not found" }
  /staff/audit:
    get:
      operationId: listStaffAuditEvents
      tags: [staff]
      summary: List operational audit events without customer personal data
      parameters:
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffAuditEvent"
        "403": { description: "Owner or analyst access required" }
  /staff/exports:
    get:
      operationId: getStaffExport
      tags: [staff]
      summary: Generate a controlled, privacy-safe operations or analytics export
      parameters:
        - name: report
          in: query
          required: true
          schema:
            type: string
            enum: [operations_summary, analytics_summary]
        - $ref: "#/components/parameters/StaffDateFrom"
        - $ref: "#/components/parameters/StaffDateTo"
      responses:
        "200":
          description: Controlled export data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffExport"
        "403": { description: "Owner or analyst access required" }
  /staff/journal:
    get:
      operationId: listStaffJournalPosts
      tags: [staff]
      summary: List all Journal articles for staff management
      responses:
        "200":
          description: Journal articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffJournalPost"
    post:
      operationId: createStaffJournalPost
      tags: [staff]
      summary: Create a Journal article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffJournalPostInput"
      responses:
        "201":
          description: Article created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffJournalPost"
        "400":
          description: Invalid article
        "403":
          description: Editor or owner access required
  /staff/journal/{id}:
    patch:
      operationId: updateStaffJournalPost
      tags: [staff]
      summary: Update, publish, draft, or archive a Journal article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F-]{36}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffJournalPostUpdate"
      responses:
        "200":
          description: Article updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffJournalPost"
        "400":
          description: Invalid update
        "403":
          description: Editor or owner access required
        "404":
          description: Article not found
components:
  parameters:
    StaffEntityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: "^[0-9a-fA-F-]{36}$"
    StaffDateFrom:
      name: from
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    StaffDateTo:
      name: to
      in: query
      schema:
        type: string
        pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Acknowledgement:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    AnalyticsEventInput:
      type: object
      required: [eventId, eventVersion, anonymousId, sessionId, eventName, path, consent, occurredAt]
      properties:
        eventId:
          type: string
          minLength: 8
          maxLength: 128
        eventVersion:
          type: number
          minimum: 1
        anonymousId:
          type: string
          minLength: 8
          maxLength: 128
        sessionId:
          type: string
          minLength: 8
          maxLength: 128
        eventName:
          type: string
          enum: [page_view, product_view, size_guide_opened, size_selected, stylist_inquiry_started, stylist_inquiry_completed, add_to_bag, cart_opened, checkout_started, checkout_form_completed, payment_clicked, checkout_payment_unavailable]
        path:
          type: string
          maxLength: 512
        referrer:
          type: string
          maxLength: 1024
        source:
          type: string
          maxLength: 128
        utmMedium:
          type: string
          maxLength: 128
        utmCampaign:
          type: string
          maxLength: 256
        deviceType:
          type: string
          enum: [mobile, tablet, desktop, unknown]
        consent:
          type: string
          enum: [essential_only, analytics, marketing]
        properties:
          type: object
          additionalProperties: true
        occurredAt:
          type: string
          format: date-time
    ConsentInput:
      type: object
      required: [anonymousId, state, policyVersion]
      properties:
        anonymousId:
          type: string
          minLength: 8
          maxLength: 128
        state:
          type: string
          enum: [essential_only, analytics, marketing]
        policyVersion:
          type: string
          maxLength: 64
        region:
          type: string
          maxLength: 32
    ConsentRecord:
      type: object
      required: [id, anonymousId, state, policyVersion, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        anonymousId: { type: string }
        state: { type: string }
        policyVersion: { type: string }
        createdAt: { type: string, format: date-time }
    EnquiryInput:
      type: object
      required: [message]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, maxLength: 320 }
        phone: { type: string, maxLength: 40 }
        productSlug: { type: string, maxLength: 160 }
        message: { type: string, minLength: 8, maxLength: 2000 }
    Enquiry:
      type: object
      required: [id, message, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        name: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        productSlug: { type: ["string", "null"] }
        message: { type: string }
        status: { type: string }
        handlingNotes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    JournalPostSummary:
      type: object
      required: [slug, title, excerpt, authorName, publishedAt]
      properties:
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        coverImageUrl: { type: ["string", "null"] }
        authorName: { type: string }
        publishedAt: { type: string, format: date-time }
    JournalPost:
      allOf:
        - $ref: "#/components/schemas/JournalPostSummary"
        - type: object
          required: [body]
          properties:
            body: { type: string }
    StaffJournalPostInput:
      type: object
      required: [slug, title, excerpt, body, authorName, status]
      properties:
        slug: { type: string, minLength: 3, maxLength: 140, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 4, maxLength: 180 }
        excerpt: { type: string, minLength: 20, maxLength: 360 }
        body: { type: string, minLength: 100, maxLength: 50000 }
        coverImageUrl: { type: ["string", "null"], maxLength: 2048 }
        authorName: { type: string, minLength: 2, maxLength: 120 }
        status: { type: string, enum: [draft, published, archived] }
    StaffJournalPostUpdate:
      type: object
      minProperties: 1
      properties:
        slug: { type: string, minLength: 3, maxLength: 140, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$" }
        title: { type: string, minLength: 4, maxLength: 180 }
        excerpt: { type: string, minLength: 20, maxLength: 360 }
        body: { type: string, minLength: 100, maxLength: 50000 }
        coverImageUrl: { type: ["string", "null"], maxLength: 2048 }
        authorName: { type: string, minLength: 2, maxLength: 120 }
        status: { type: string, enum: [draft, published, archived] }
    StaffJournalPost:
      type: object
      required: [id, slug, title, excerpt, body, authorName, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        slug: { type: string }
        title: { type: string }
        excerpt: { type: string }
        body: { type: string }
        coverImageUrl: { type: ["string", "null"] }
        authorName: { type: string }
        status: { type: string, enum: [draft, published, archived] }
        publishedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffProfile:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        email: { type: string, maxLength: 320 }
        role: { type: string, enum: [owner, operations, stylist, editor, analyst] }
    StaffOrder:
      type: object
      required: [id, orderNumber, customerName, customerEmail, total, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        orderNumber: { type: string }
        customerName: { type: string }
        customerEmail: { type: string, maxLength: 320 }
        total: { type: string }
        currency: { type: string }
        status: { type: string }
        atelierNotes: { type: ["string", "null"], maxLength: 2000 }
        deliveryNotes: { type: ["string", "null"], maxLength: 2000 }
        refundRequestStatus: { type: ["string", "null"], enum: [requested, approved, declined, null] }
        refundRequestReason: { type: ["string", "null"], maxLength: 1000 }
        refundDecisionNote: { type: ["string", "null"], maxLength: 1000 }
        refundRequestedAt: { type: ["string", "null"], format: date-time }
        refundReviewedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffOrderUpdate:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [atelier_confirmation, in_production, ready, fulfilled, cancelled]
        atelierNotes: { type: ["string", "null"], maxLength: 2000 }
        deliveryNotes: { type: ["string", "null"], maxLength: 2000 }
        refundRequestReason: { type: string, minLength: 8, maxLength: 1000 }
        refundRequestDecision: { type: string, enum: [approved, declined] }
        refundDecisionNote: { type: string, minLength: 8, maxLength: 1000 }
    StaffEnquiryUpdate:
      type: object
      minProperties: 1
      properties:
        status:
          type: string
          enum: [new, in_progress, resolved, closed]
        handlingNotes: { type: ["string", "null"], maxLength: 2000 }
    StaffOverview:
      type: object
      required: [ordersTotal, ordersInProduction, openEnquiries, storefrontEvents7d, paymentIsLive, from, to, generatedAt, freshnessMinutes, metrics]
      properties:
        ordersTotal: { type: number, minimum: 0 }
        ordersInProduction: { type: number, minimum: 0 }
        openEnquiries: { type: number, minimum: 0 }
        storefrontEvents7d: { type: number, minimum: 0 }
        paymentIsLive: { type: boolean }
        from: { type: string }
        to: { type: string }
        generatedAt: { type: string, format: date-time }
        freshnessMinutes: { type: number, minimum: 1 }
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/StaffMetric"
    StaffFunnel:
      type: object
      required: [periodDays, from, to, generatedAt, privacyNote, events]
      properties:
        periodDays: { type: number, minimum: 1 }
        from: { type: string }
        to: { type: string }
        generatedAt: { type: string, format: date-time }
        privacyNote: { type: string }
        events:
          type: array
          items:
            type: object
            required: [eventName, count]
            properties:
              eventName:
                type: string
                enum: [page_view, product_view, size_guide_opened, size_selected, stylist_inquiry_started, stylist_inquiry_completed, add_to_bag, cart_opened, checkout_started, checkout_form_completed, payment_clicked, checkout_payment_unavailable]
              count: { type: number, minimum: 0 }
    StaffMetric:
      type: object
      required: [key, label, definition, value]
      properties:
        key: { type: string }
        label: { type: string }
        definition: { type: string }
        value: { type: number, minimum: 0 }
    StaffPrivacyRequestInput:
      type: object
      required: [requestType, requesterEmail]
      properties:
        requestType: { type: string, enum: [access, deletion] }
        requesterName: { type: ["string", "null"], maxLength: 120 }
        requesterEmail: { type: string, maxLength: 320 }
        verificationNote: { type: ["string", "null"], maxLength: 1000 }
    StaffPrivacyRequestUpdate:
      type: object
      minProperties: 1
      properties:
        status: { type: string, enum: [received, identity_verified, in_progress, completed, rejected] }
        verificationNote: { type: ["string", "null"], maxLength: 1000 }
        resolutionNote: { type: ["string", "null"], maxLength: 2000 }
    StaffPrivacyRequest:
      type: object
      required: [id, requestType, requesterEmail, status, createdAt, updatedAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        requestType: { type: string, enum: [access, deletion] }
        requesterName: { type: ["string", "null"] }
        requesterEmail: { type: string }
        status: { type: string, enum: [received, identity_verified, in_progress, completed, rejected] }
        verificationNote: { type: ["string", "null"] }
        resolutionNote: { type: ["string", "null"] }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffNotificationAcknowledgement:
      type: object
      required: [acknowledged]
      properties:
        acknowledged: { type: boolean }
    StaffNotification:
      type: object
      required: [id, severity, title, body, acknowledged, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        severity: { type: string, enum: [info, attention, urgent] }
        title: { type: string }
        body: { type: string }
        acknowledged: { type: boolean }
        createdAt: { type: string, format: date-time }
    StaffAuditEvent:
      type: object
      required: [id, action, entityType, metadata, createdAt]
      properties:
        id: { type: string, pattern: "^[0-9a-fA-F-]{36}$" }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: ["string", "null"] }
        metadata:
          type: object
          additionalProperties: true
        createdAt: { type: string, format: date-time }
    StaffExport:
      type: object
      required: [report, filename, generatedAt, privacyNote, columns, rows]
      properties:
        report: { type: string, enum: [operations_summary, analytics_summary] }
        filename: { type: string }
        generatedAt: { type: string, format: date-time }
        privacyNote: { type: string }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true

